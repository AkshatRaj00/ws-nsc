name: 24x7 Repository Sentinel

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Close Inactive Issues & Stale Tracking
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: '⏳ This research discussion/issue has been open for 45 days without updates. It will automatically close in 7 days if unresponded.'
          stale-pr-message: '⏳ This pull request has been inactive for 21 days. Please update branch against `main` or provide validation metrics.'
          days-before-stale: 45
          days-before-close: 7
          stale-issue-label: 'status: stale'
          stale-pr-label: 'status: stale'
