name: PR Sentinel & Auto Triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label PR Size
        uses: codelytv/pr-size-labeler@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: '15'
          s_max_size: '100'
          m_max_size: '500'
          l_max_size: '1000'
          fail_if_xl: 'false'

      - name: Research PR Initial Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **WS-NSC Automated Gatekeeper:** Thank you for submitting this empirical contribution!\n\n- [ ] Did you include benchmark metrics (Gain %, Forgetting relative %, Anchor drift)?\n- [ ] Is `ws_nsc.py` or new baseline validated under AMP/Float32?\n\nMaintainer @AkshatRaj00 will review the mathematical formulations shortly.'
            });
